name: CI Pipeline

# 1. Define quando o pipeline será executado
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Define o sistema operacional (runner)
    runs-on: ubuntu-latest

    steps:
      # 2. Faz o checkout do código do repositório
      - uses: actions/checkout@v4

      # 3. Configura a versão do Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Instala as dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Executa os testes automatizados (pytest)
      - name: Run Tests
        run: |
          pytest
